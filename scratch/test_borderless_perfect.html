<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Perfect Borderless Hero Integration</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Override hero background to #080808 as requested */
    #hero {
      background: #080808 !important;
      overflow: hidden !important;
    }

    /* Completely BORDERLESS Portrait Presentation */
    .hero-reference-portrait-stage,
    .hero-cinematic-portrait-stage,
    .hero-borderless-portrait-stage {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: clamp(520px, 56vw, 700px);
      display: flex;
      justify-content: center;
      align-items: center;
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      overflow: visible !important;
    }

    /* Dramatic, concentrated red atmospheric glow behind portrait & window */
    .hero-portrait-ambient-glow,
    .hero-cinematic-ambient-glow,
    .hero-borderless-ambient-glow {
      position: absolute;
      width: clamp(380px, 44vw, 560px);
      height: clamp(460px, 52vw, 640px);
      top: 50%;
      left: 32%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at 42% 45%, rgba(229, 9, 43, 0.48) 0%, rgba(229, 9, 43, 0.18) 45%, transparent 72%);
      filter: blur(56px);
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
      animation: cinematicRedBreathe 7s infinite ease-in-out;
    }

    @keyframes cinematicRedBreathe {
      0%, 100% {
        opacity: 0.85;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    /* Seamless Borderless Portrait Container — NO BORDER, NO CARD, NO BOX */
    .hero-reference-portrait-card,
    .hero-cinematic-portrait-card,
    .hero-borderless-portrait-card {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border: none !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      overflow: visible !important;
      /* Advanced feathered boundary mask — perfectly preserves hair & melts edges into #080808 */
      -webkit-mask-image: 
        radial-gradient(ellipse 72% 82% at 52% 46%, #000 52%, rgba(0, 0, 0, 0.85) 70%, transparent 100%),
        linear-gradient(to top, transparent 0%, #000 14%, #000 94%, transparent 100%),
        linear-gradient(to right, transparent 0%, #000 12%, #000 86%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: 
        radial-gradient(ellipse 72% 82% at 52% 46%, #000 52%, rgba(0, 0, 0, 0.85) 70%, transparent 100%),
        linear-gradient(to top, transparent 0%, #000 14%, #000 94%, transparent 100%),
        linear-gradient(to right, transparent 0%, #000 12%, #000 86%, transparent 100%);
      mask-composite: intersect;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Portrait Image: Large, sharp, natural facial features and skin tone */
    .hero-reference-portrait-img,
    .hero-cinematic-portrait-img,
    .hero-borderless-portrait-img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      object-position: 50% 15% !important;
      display: block !important;
      filter: contrast(1.04) brightness(0.98);
      border: none !important;
    }

    /* Directional Cinematic Red Window Illumination (Matching the exact uploaded reference) */
    .hero-cinematic-rim-light,
    .hero-borderless-window-light {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: 
        radial-gradient(ellipse at 16% 36%, rgba(229, 9, 43, 0.92) 0%, rgba(229, 9, 43, 0.36) 32%, transparent 60%),
        linear-gradient(90deg, rgba(229, 9, 43, 0.58) 0%, rgba(229, 9, 43, 0.2) 16%, transparent 36%);
      mix-blend-mode: screen;
    }

    /* Soft edge vignette to dissolve coat and sides into #080808 */
    .hero-portrait-vignette,
    .hero-cinematic-vignette,
    .hero-borderless-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background: 
        linear-gradient(to top, #080808 0%, rgba(8, 8, 8, 0.85) 12%, transparent 32%),
        linear-gradient(to right, transparent 66%, rgba(8, 8, 8, 0.95) 100%),
        linear-gradient(to left, transparent 72%, rgba(8, 8, 8, 0.85) 100%),
        linear-gradient(to bottom, transparent 82%, rgba(8, 8, 8, 0.55) 100%);
    }

    /* Hidden inner border / frames */
    .hero-cinematic-inner-rim,
    .hero-floating-ability-badge {
      display: none !important;
    }

    /* Fade bottom helper */
    .hero-portrait-fade-bottom,
    .hero-cinematic-fade-bottom {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Embedded index.html test -->
</body>
</html>
