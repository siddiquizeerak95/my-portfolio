<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="waveLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#a1a1aa" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#e4e4e7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#71717a" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#d4d4d8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e4e4e7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Distant Celestial Planet/Moon floating above wave ridge -->
  <g transform="translate(1040, 45)">
    <!-- Planet Atmosphere Glow -->
    <circle cx="28" cy="28" r="42" fill="url(#moonGlow)"/>
    <!-- Planet Sphere Dark Silhouette with rim crescent -->
    <circle cx="28" cy="28" r="24" fill="#0c0d10"/>
    <path d="M 28,4 A 24 24 0 0 1 52,28 A 24 24 0 0 0 28,4 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Flowing 3D Wave Meshes / Mathematical Bezier Curves -->
  <!-- Wave 1 (Deepest) -->
  <path d="M 0,160 C 240,110 480,180 720,130 C 960,80 1200,150 1440,110" 
        fill="none" stroke="url(#waveLine3)" stroke-width="1.2"/>

  <!-- Wave 2 (Middle) -->
  <path d="M 0,145 C 220,175 460,115 700,165 C 940,205 1180,110 1440,135" 
        fill="none" stroke="url(#waveLine2)" stroke-width="1.6"/>

  <!-- Wave 3 (Upper Prominent Horizon Crest) -->
  <path d="M 0,130 C 260,80 500,155 760,105 C 1020,55 1240,140 1440,95" 
        fill="none" stroke="url(#waveLine1)" stroke-width="2.2"/>

  <!-- Secondary Ribbon Density Tracks -->
  <path d="M 0,138 C 260,88 500,163 760,113 C 1020,63 1240,148 1440,103" 
        fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>

  <path d="M 0,122 C 260,72 500,147 760,97 C 1020,47 1240,132 1440,87" 
        fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.18"/>

  <!-- Subtle Wave Mesh Fill Base (Translucent gradient beneath the waves) -->
  <path d="M 0,130 C 260,80 500,155 760,105 C 1020,55 1240,140 1440,95 L 1440,220 L 0,220 Z" 
        fill="url(#waveLine1)" opacity="0.04"/>
</svg>
