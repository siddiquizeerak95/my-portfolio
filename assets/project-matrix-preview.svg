<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C202C"/>
      <stop offset="50%" stop-color="#151822"/>
      <stop offset="100%" stop-color="#11131A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" fill="none" stroke="#474F64" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#202534"/>
  <rect x="0" y="28" width="800" height="16" fill="#202534"/>
  <line x1="0" y1="44" x2="800" y2="44" stroke="#384054" stroke-width="1"/>
  <circle cx="26" cy="22" r="5.5" fill="#FF5F56"/>
  <circle cx="44" cy="22" r="5.5" fill="#FFBD2E"/>
  <circle cx="62" cy="22" r="5.5" fill="#27C93F"/>
  <rect x="220" y="10" width="360" height="24" rx="12" fill="#13151E" stroke="#3C4458" stroke-width="1"/>
  <text x="400" y="26" fill="#D0D6E5" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">terminal // c-memory-allocator</text>

  <!-- Code Matrix Window -->
  <g transform="translate(36, 64)">
    <rect width="728" height="388" rx="10" fill="#12151E" stroke="#32394C" stroke-width="1"/>
    <!-- Terminal text -->
    <g fill="#B8C2D6" font-family="'IBM Plex Mono', monospace" font-size="13">
      <text x="24" y="38" fill="#00E676" font-weight="700">$ ./matrix_core --benchmark --threads=8</text>
      <text x="24" y="74" fill="#8E99B0">[SYSTEM] Initializing memory pool: 64MB buffer...</text>
      <text x="24" y="100">[ALLOC] Block at 0x7ffd9820 • size: 4096 bytes <tspan fill="#22C55E" font-weight="600">[OK]</tspan></text>
      <text x="24" y="126">[PAGING] Virtual address map verified: 0 faults</text>
      <text x="24" y="162" fill="#FFFFFF" font-weight="600">[BENCHMARK MATRIX] 10,000,000 iterations</text>
      <text x="24" y="188" fill="#E2E7F2">&gt; Direct pointer arithmetic: 1.42 ms</text>
      <text x="24" y="214" fill="#61DAFB">&gt; Cache-aligned SIMD stride: 0.38 ms (3.7x speedup)</text>
      <text x="24" y="250" fill="#22C55E" font-weight="600">[STATUS] Execution finished with exit code 0</text>
      <text x="24" y="286" fill="#FFFFFF">&gt; All heap allocations verified and freed: 0 leaks.</text>
    </g>
    <!-- Graph telemetry HUD on right -->
    <g transform="translate(484, 30)">
      <rect width="216" height="295" rx="8" fill="#1B1F2D" stroke="#3B4459" stroke-width="1"/>
      <text x="20" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">MEMORY PROFILE</text>
      <!-- Telemetry bars -->
      <text x="20" y="60" fill="#A8B2C7" font-family="'IBM Plex Mono', monospace" font-size="10">HEAP BUFFER</text>
      <rect x="20" y="68" width="176" height="12" rx="3" fill="#272D3F"/>
      <rect x="20" y="68" width="144" height="12" rx="3" fill="#61DAFB"/>
      <text x="20" y="102" fill="#A8B2C7" font-family="'IBM Plex Mono', monospace" font-size="10">STACK ALLOC</text>
      <rect x="20" y="110" width="176" height="12" rx="3" fill="#272D3F"/>
      <rect x="20" y="110" width="105" height="12" rx="3" fill="#00E676"/>
      <text x="20" y="144" fill="#A8B2C7" font-family="'IBM Plex Mono', monospace" font-size="10">SIMD VECTOR</text>
      <rect x="20" y="152" width="176" height="12" rx="3" fill="#272D3F"/>
      <rect x="20" y="152" width="164" height="12" rx="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>