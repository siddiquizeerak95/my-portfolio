<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Rich Charcoal/Steel Window Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="50%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>

    <!-- Glowing Rim Border -->
    <linearGradient id="glowRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E768A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#444C60" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6E768A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Studio Radial Spotlight behind Monolith -->
    <radialGradient id="studioSpotlight" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3D4458" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#262B3A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#141720" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Monolith Lit Facet (Left) -->
    <linearGradient id="monolithLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E7F0"/>
      <stop offset="70%" stop-color="#9CA5B8"/>
      <stop offset="100%" stop-color="#636C80"/>
    </linearGradient>

    <!-- 3D Monolith Shadow Facet (Right) -->
    <linearGradient id="monolithShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C758A"/>
      <stop offset="50%" stop-color="#424A5C"/>
      <stop offset="100%" stop-color="#292E3B"/>
    </linearGradient>

    <!-- Apex Red Glow Filter -->
    <filter id="apexGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Outer Container -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" fill="none" stroke="url(#glowRim)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#222735"/>
  <rect x="0" y="28" width="800" height="16" fill="#222735"/>
  <line x1="0" y1="44" x2="800" y2="44" stroke="#3D4559" stroke-width="1"/>

  <!-- Traffic Light Window Controls -->
  <circle cx="26" cy="22" r="5.5" fill="#FF5F56" opacity="0.95"/>
  <circle cx="44" cy="22" r="5.5" fill="#FFBD2E" opacity="0.95"/>
  <circle cx="62" cy="22" r="5.5" fill="#27C93F" opacity="0.95"/>

  <!-- Browser URL Pill -->
  <rect x="200" y="10" width="400" height="24" rx="12" fill="#141720" stroke="#424A5E" stroke-width="1"/>
  <circle cx="216" cy="22" r="3" fill="#22C55E"/>
  <text x="400" y="26" fill="#DCE1ED" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" text-anchor="middle">zsstudio.netlify.app // portfolio</text>

  <!-- Viewport Stage -->
  <g transform="translate(36, 64)">
    <!-- Stage Base Screen -->
    <rect width="728" height="388" rx="10" fill="#131620" stroke="#343B4E" stroke-width="1"/>

    <!-- Soft Radial Studio Ambient Light -->
    <rect width="728" height="388" rx="10" fill="url(#studioSpotlight)"/>

    <!-- Wireframe Horizon Grid with Clean Contrast -->
    <g stroke="#9AA5BD" stroke-width="0.85" opacity="0.45">
      <line x1="0" y1="240" x2="728" y2="240" stroke="#C8D2E6" stroke-width="1.4" opacity="0.75"/>
      <line x1="0" y1="265" x2="728" y2="265"/>
      <line x1="0" y1="295" x2="728" y2="295"/>
      <line x1="0" y1="330" x2="728" y2="330"/>
      <line x1="0" y1="370" x2="728" y2="370"/>
      <!-- Converging perspective lines to horizon center (364, 180) -->
      <line x1="364" y1="180" x2="30" y2="388"/>
      <line x1="364" y1="180" x2="140" y2="388"/>
      <line x1="364" y1="180" x2="250" y2="388"/>
      <line x1="364" y1="180" x2="364" y2="388"/>
      <line x1="364" y1="180" x2="478" y2="388"/>
      <line x1="364" y1="180" x2="588" y2="388"/>
      <line x1="364" y1="180" x2="698" y2="388"/>
    </g>

    <!-- Base Ambient Occlusion Shadow Under 3D Monolith -->
    <ellipse cx="364" cy="254" rx="120" ry="14" fill="#000000" opacity="0.7"/>

    <!-- 3D Monolith Pyramid Object (Cleanly Visible Geometry) -->
    <!-- Left Facet (Light-facing) -->
    <polygon points="364,55 258,252 364,252" fill="url(#monolithLit)" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.85"/>
    <!-- Right Facet (Shadow-facing) -->
    <polygon points="364,55 364,252 470,252" fill="url(#monolithShadow)" stroke="#B8C2D6" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Center Crease Highlight -->
    <line x1="364" y1="55" x2="364" y2="252" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.95"/>

    <!-- Radiant Apex Glowing Crown Orb -->
    <circle cx="364" cy="55" r="28" fill="#E5092B" opacity="0.35" filter="url(#apexGlow)"/>
    <circle cx="364" cy="55" r="16" fill="#FFFFFF" opacity="0.65" filter="url(#apexGlow)"/>
    <circle cx="364" cy="55" r="10" fill="#FFFFFF"/>
    <circle cx="364" cy="55" r="4" fill="#FFFFFF" opacity="0.95"/>

    <!-- Top Left UI Brand Pill -->
    <rect x="24" y="24" width="140" height="30" rx="8" fill="#1F2536" stroke="#4A546E" stroke-width="1"/>
    <circle cx="38" cy="39" r="3.5" fill="#E5092B"/>
    <text x="48" y="43" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">ZEERAK STUDIO</text>

    <!-- Top Right Status Indicator -->
    <rect x="578" y="24" width="126" height="30" rx="8" fill="#1F2536" stroke="#4A546E" stroke-width="1"/>
    <circle cx="594" cy="39" r="4" fill="#22C55E"/>
    <text x="604" y="43" fill="#E2E7F5" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.05em">LIVE 3D V.2</text>

    <!-- In-Screen Editorial Typography -->
    <g transform="translate(24, 88)">
      <text x="0" y="0" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">Hybrid 3D Portfolio</text>
      <text x="0" y="26" fill="#C5CDE0" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400">Vanilla Web Standards • Zero Runtime Overhead • 60 FPS</text>
    </g>
  </g>
</svg>