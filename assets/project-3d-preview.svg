<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="50%" stop-color="#161822"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="cubeFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#888899"/>
    </linearGradient>
    <linearGradient id="cubeFace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555566"/>
      <stop offset="100%" stop-color="#22222a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#bgGrad3)"/>
  <rect x="1" y="1" width="798" height="478" rx="15" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#181a24" opacity="0.8"/>
  <circle cx="28" cy="21" r="5" fill="#3f3f46"/>
  <circle cx="46" cy="21" r="5" fill="#3f3f46"/>
  <circle cx="64" cy="21" r="5" fill="#3f3f46"/>
  <rect x="220" y="9" width="360" height="24" rx="12" fill="#0b0c10" stroke="#252936" stroke-width="1"/>
  <text x="400" y="25" fill="#a1a1aa" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">canvas3d // orbital-quaternion-engine</text>

  <!-- Viewport -->
  <g transform="translate(40, 68)">
    <rect width="720" height="370" rx="10" fill="#050608"/>
    <!-- Wireframe Sphere & Rings -->
    <ellipse cx="360" cy="185" rx="180" ry="60" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <ellipse cx="360" cy="185" rx="180" ry="120" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.2" transform="rotate(35, 360, 185)"/>
    <ellipse cx="360" cy="185" rx="180" ry="120" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.2" transform="rotate(-35, 360, 185)"/>
    <circle cx="360" cy="185" r="180" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.15"/>

    <!-- 3D Geometric Polyhedron / Tesseract Cube in Center -->
    <polygon points="360,110 430,150 360,190 290,150" fill="url(#cubeFace1)" opacity="0.85"/>
    <polygon points="290,150 360,190 360,260 290,220" fill="url(#cubeFace2)"/>
    <polygon points="360,190 430,150 430,220 360,260" fill="#383844"/>

    <!-- Particle Points -->
    <g fill="#ffffff">
      <circle cx="210" cy="140" r="2" opacity="0.6"/>
      <circle cx="490" cy="230" r="3" opacity="0.8"/>
      <circle cx="510" cy="120" r="1.5" opacity="0.5"/>
      <circle cx="240" cy="250" r="2.5" opacity="0.7"/>
      <circle cx="360" cy="60" r="3" opacity="0.9"/>
    </g>

    <!-- HUD text -->
    <text x="24" y="36" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="12">FPS: 60.0 &#8226; DRAW_CALLS: 1 &#8226; SHADER: HARDWARE</text>
  </g>
</svg>
