<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="archSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="towerFace1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#404048"/>
      <stop offset="50%" stop-color="#282830"/>
      <stop offset="100%" stop-color="#151518"/>
    </linearGradient>
    <linearGradient id="towerFace2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#202025"/>
      <stop offset="50%" stop-color="#35353d"/>
      <stop offset="100%" stop-color="#555560"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="400" fill="url(#archSky)"/>

  <!-- Dramatic Center Skyscraper Vanishing Upward -->
  <!-- Left Facet -->
  <polygon points="300,30 140,400 300,400" fill="url(#towerFace1)"/>
  <!-- Right Facet -->
  <polygon points="300,30 300,400 460,400" fill="url(#towerFace2)"/>

  <!-- Left Flanking Tower -->
  <polygon points="200,80 30,400 130,400" fill="#141418" opacity="0.8"/>
  <polygon points="200,80 130,400 180,400" fill="#25252c" opacity="0.8"/>

  <!-- Right Flanking Tower -->
  <polygon points="400,80 420,400 470,400" fill="#25252c" opacity="0.8"/>
  <polygon points="400,80 470,400 570,400" fill="#141418" opacity="0.8"/>

  <!-- Horizontal Mullions & Floor Slabs on Center Tower (Perspective Grid) -->
  <g stroke="#ffffff" stroke-width="0.75" opacity="0.35">
    <line x1="290" y1="60" x2="310" y2="60"/>
    <line x1="280" y1="90" x2="320" y2="90"/>
    <line x1="270" y1="125" x2="330" y2="125"/>
    <line x1="258" y1="165" x2="342" y2="165"/>
    <line x1="242" y1="210" x2="358" y2="210"/>
    <line x1="222" y1="260" x2="378" y2="260"/>
    <line x1="198" y1="315" x2="402" y2="315"/>
    <line x1="170" y1="375" x2="430" y2="375"/>
  </g>

  <!-- Center Spine Pylon (Crisp White Monolith Line) -->
  <line x1="300" y1="30" x2="300" y2="400" stroke="#ffffff" stroke-width="1.8" opacity="0.85"/>

  <!-- Angular Light Sheen Diagonal Across Windows -->
  <polygon points="300,30 380,400 320,400" fill="url(#glassSheen)"/>

  <!-- Vignette edges -->
  <rect width="600" height="400" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>
