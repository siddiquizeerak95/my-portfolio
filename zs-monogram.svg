<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- ZS STUDIO — Swiss Precision Interlocking Geometric Monogram -->
  <!-- Outer Architectural Framing -->
  <rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Monogram Graphic Elements (Pure Vector Paths) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter Z: Upper horizontal bar -->
    <path d="M 24 26 H 76" stroke-width="6.5" stroke-linecap="square" />

    <!-- Letter Z: Upper diagonal segment (stops before central S crossing) -->
    <path d="M 76 26 L 56 46" stroke-width="6.5" stroke-linecap="square" />

    <!-- Letter S: Interlocking ribbon weaving through the diagonal gap -->
    <!-- S top arc -->
    <path d="M 72 38 C 72 23 52 23 46 23 C 32 23 26 31 26 40 C 26 48 35 52 46 54 L 54 56 C 65 58 74 62 74 70 C 74 79 66 87 50 87 C 40 87 28 85 26 72" stroke-width="6" />

    <!-- Letter Z: Lower diagonal segment (resumes after central S crossing) -->
    <path d="M 44 58 L 24 78" stroke-width="6.5" stroke-linecap="square" />

    <!-- Letter Z: Lower horizontal bar -->
    <path d="M 24 78 H 76" stroke-width="6.5" stroke-linecap="square" />

    <!-- Precision focal dot on central axis -->
    <circle cx="50" cy="55" r="2.2" fill="#FFFFFF" stroke="none" />
  </g>
</svg>